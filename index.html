<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Happy Diwali 🪔</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Dancing+Script:wght@500;600&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<radialGradient id="gc" cx=".35" cy=".3" r=".95"><stop offset="0" stop-color="#ffc27a"/><stop offset=".45" stop-color="#d9672a"/><stop offset="1" stop-color="#5e1a05"/></radialGradient>
<linearGradient id="gp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe3a0"/><stop offset="1" stop-color="#e0771f"/></linearGradient>
<linearGradient id="gr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6e2408"/><stop offset=".35" stop-color="#ffb760"/><stop offset=".65" stop-color="#ffd48a"/><stop offset="1" stop-color="#6e2408"/></linearGradient>
<radialGradient id="go"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#b8560e"/></radialGradient>
<linearGradient id="gf" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff4d00"/><stop offset=".55" stop-color="#ff9d00"/><stop offset="1" stop-color="#ffe14d"/></linearGradient>
<linearGradient id="gm" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffb300"/><stop offset="1" stop-color="#fff3a8"/></linearGradient>
<radialGradient id="gl"><stop offset="0" stop-color="#ffb300" stop-opacity=".6"/><stop offset="1" stop-color="#ff6a00" stop-opacity="0"/></radialGradient>
<radialGradient id="gbl"><stop offset="0" stop-color="#6aa8ff"/><stop offset="1" stop-color="#6aa8ff" stop-opacity="0"/></radialGradient>
</defs></svg>
<div id="sky"></div><div id="stars"></div><div id="moon"></div><div id="bokeh"></div><div id="kandil"></div>
<div class="mandala bgm"></div><div class="mandala m2 bgm"></div>
<div id="dark"></div><canvas id="fx"></canvas><div id="petals"></div><div id="city"></div>
<div id="lights"></div><div id="sl1" class="sl"></div><div id="sl2" class="sl"></div><div class="lantern l1"></div><div class="lantern l2"></div>
<audio id="song" loop preload="auto"></audio>
<section id="start">
  <div class="rays"></div><div class="mandala"></div><div class="mandala m2"></div>
  <button id="diyaBtn" aria-label="Light the diya"><div class="halo"></div></button>
  <h1 id="hello" class="title">Happy Diwali</h1>
  <p id="sub">शुभ दीपावली</p>
  <p id="hint">Tap the diya to light it ✨</p>
  <button id="openBtn" class="btn" hidden>Open Wishes 🎆</button>
</section>
<main id="app" hidden><div id="stage"></div>
<nav><button id="prev">‹</button><div id="dots"></div><button id="next">›</button></nav></main>
<div id="scat"></div><div id="dl"></div><div id="dr"></div><div id="ground2"></div><div id="ground"></div>
<button id="music" hidden>🔊</button><button id="crack" hidden>🧨</button>
<script src="js/script.js"></script></body></html>
