<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Happy Diwali 🪔</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Dancing+Script:wght@500;600&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd877"/><stop offset=".5" stop-color="#d9731a"/><stop offset="1" stop-color="#8a3200"/></linearGradient>
<linearGradient id="gf" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff5a00"/><stop offset=".5" stop-color="#ffb300"/><stop offset="1" stop-color="#fff6c2"/></linearGradient></defs></svg>
<div id="sky"></div><div id="stars"></div><div id="moon"></div><div id="bokeh"></div><div id="kandil"></div>
<div id="dark"></div><canvas id="fx"></canvas><div id="petals"></div><div id="city"></div>
<div id="lights"></div><div class="lantern l1"></div><div class="lantern l2"></div>
<audio id="song" loop preload="auto"></audio>
<section id="start">
  <div class="mandala"></div><div class="mandala m2"></div>
  <button id="diyaBtn" aria-label="Light the diya"><div class="halo"></div></button>
  <h1 id="hello" class="title">Happy Diwali</h1>
  <p id="sub">शुभ दीपावली</p>
  <p id="hint">Tap the diya to light it ✨</p>
  <button id="openBtn" class="btn" hidden>Open Wishes 🎆</button>
</section>
<main id="app" hidden><div id="stage"></div>
<nav><button id="prev">‹</button><div id="dots"></div><button id="next">›</button></nav></main>
<div id="ground"></div>
<button id="music" hidden>🔊</button><button id="crack" hidden>🧨</button>
<script src="js/script.js"></script></body></html>
